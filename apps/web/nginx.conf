# Serves the built SPA inside the `web` container. Public traffic always goes through the edge Nginx.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Hashed build assets can be cached aggressively.
  location /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Self-hosted OCR runtime (tesseract worker/WASM, MRZ model, zxing). Versioned with the image,
  # so cache for a day; .wasm must be served with its own MIME type for streaming compilation.
  location /ocr/ {
    types {
      application/wasm wasm;
      application/javascript js;
      application/octet-stream traineddata;
    }
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
