# Edge reverse proxy. Only this container is published on the host.
# TLS termination: see README "Production deployment" - terminate HTTPS here
# (server block with ssl_certificate) or in front of this container (cloud LB),
# and always forward X-Forwarded-Proto so the API can set Secure cookies.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" rid=$request_id rt=$request_time';
  access_log /var/log/nginx/access.log main;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 65;
  server_tokens   off;

  # DICOM uploads / document uploads can be large; the API enforces its own limits too.
  client_max_body_size 64m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/dicom+json image/svg+xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Rendered from templates/*.template by the official image entrypoint (envsubst).
  include /etc/nginx/conf.d/*.conf;
}
