# Production-oriented composition. Only `nginx` publishes a host port.
# Development conveniences (exposed ports, host upstreams) live in docker-compose.dev.yml.
#
#   docker compose up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d   (development)

name: osgb-platform

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  # ---------------------------------------------------------------- data stores
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-osgb}
      POSTGRES_USER: ${POSTGRES_USER:-osgb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Consumed by infrastructure/postgres/init/01-orthanc-database.sh
      ORTHANC_DB_NAME: ${ORTHANC_DB_NAME:-orthanc}
      ORTHANC_DB_USER: ${ORTHANC_DB_USER:-orthanc}
      ORTHANC_DB_PASSWORD: ${ORTHANC_DB_PASSWORD:?ORTHANC_DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-osgb} -d ${POSTGRES_DB:-osgb}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [internal]
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]
    logging: *default-logging

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BROWSER: 'on'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [internal]
    logging: *default-logging

  # ---------------------------------------------------------------- PACS
  orthanc:
    image: orthancteam/orthanc:26.8.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VERBOSE_ENABLED: 'false'
      VERBOSE_STARTUP: 'false'
      DICOM_WEB_PLUGIN_ENABLED: 'true'
      WORKLISTS_PLUGIN_ENABLED: 'true'
      POSTGRESQL_PLUGIN_ENABLED: 'true'
      ORTHANC_EXPLORER_2_ENABLED: 'true'
      # Index in its own PostgreSQL database; DICOM files on the orthanc_data volume.
      ORTHANC__POSTGRESQL__HOST: postgres
      ORTHANC__POSTGRESQL__PORT: '5432'
      ORTHANC__POSTGRESQL__DATABASE: ${ORTHANC_DB_NAME:-orthanc}
      ORTHANC__POSTGRESQL__USERNAME: ${ORTHANC_DB_USER:-orthanc}
      ORTHANC__POSTGRESQL__PASSWORD: ${ORTHANC_DB_PASSWORD:?ORTHANC_DB_PASSWORD is required}
      ORTHANC__DICOM_AET: ${ORTHANC_AET:-OSGB}
      # Known devices only. Each entry should AllowStore=true and disable Find/Move/Get.
      ORTHANC__DICOM_MODALITIES: '${ORTHANC_DICOM_MODALITIES_JSON:-{}}'
      ORTHANC__REGISTERED_USERS: '{"${ORTHANC_USERNAME:-orthanc}": "${ORTHANC_PASSWORD:?ORTHANC_PASSWORD is required}"}'
    volumes:
      - orthanc_data:/var/lib/orthanc/db
      - ./infrastructure/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
    ports:
      # Keep loopback by default. Set ORTHANC_DICOM_BIND to the PACS host's LAN IP for modalities.
      - '${ORTHANC_DICOM_BIND:-127.0.0.1}:${ORTHANC_DICOM_PORT:-4242}:4242'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/probes/test-aliveness.py --user=${ORTHANC_USERNAME:-orthanc} --pwd=${ORTHANC_PASSWORD}',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal, edge]
    logging: *default-logging

  ohif:
    image: ohif/app:v3.13.6
    restart: unless-stopped
    environment:
      PUBLIC_URL: /
      PORT: '80'
    volumes:
      - ./infrastructure/ohif/app-config.js:/usr/share/nginx/html/app-config.js:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:80/ >/dev/null || curl -fs http://127.0.0.1:80/ >/dev/null',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [edge]
    logging: *default-logging

  # ---------------------------------------------------------------- application
  api-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    restart: 'no'
    command: ['pnpm', '--filter', '@osgb/api', 'prisma:migrate:deploy']
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-osgb}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-osgb}?schema=public
      # Also used for one-off seeding: docker compose run --rm api-migrate pnpm --filter @osgb/api prisma:seed
      # With NODE_ENV=production the seed refuses the demo password; set a strong SEED_ADMIN_PASSWORD first.
      SEED_TENANT_NAME: ${SEED_TENANT_NAME:-Demo OSGB}
      SEED_TENANT_SLUG: ${SEED_TENANT_SLUG:-demo}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@demo.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123!}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_NAME: ${APP_NAME:-osgb-platform}
      APP_URL: ${APP_URL:-http://localhost:8080}
      API_PORT: '3000'
      API_PREFIX: ${API_PREFIX:-api}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-1mb}
      RATE_LIMIT_TTL: ${RATE_LIMIT_TTL:-60}
      RATE_LIMIT_LIMIT: ${RATE_LIMIT_LIMIT:-120}
      TRUST_PROXY: 'true'
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-osgb}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-osgb}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      JWT_ISSUER: ${JWT_ISSUER:-osgb-platform}
      MINIO_ENDPOINT: minio
      MINIO_PORT: '9000'
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-osgb-documents}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USERNAME: ${ORTHANC_USERNAME:-orthanc}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD}
      OHIF_VIEWER_PATH: ${OHIF_VIEWER_PATH:-/viewer}
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      orthanc:
        condition: service_healthy
    networks: [internal, edge]
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_OHIF_VIEWER_PATH: ${VITE_OHIF_VIEWER_PATH:-/viewer}
        VITE_APP_NAME: ${VITE_APP_NAME:-OSGB Platform}
    restart: unless-stopped
    networks: [edge]
    logging: *default-logging

  # ---------------------------------------------------------------- edge
  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - '${NGINX_HTTP_PORT:-8080}:80'
    environment:
      WEB_UPSTREAM: web:80
      API_UPSTREAM: api:3000
      OHIF_UPSTREAM: ohif:80
      ORTHANC_UPSTREAM: orthanc:8042
      ORTHANC_BASIC_AUTH_B64: ${ORTHANC_BASIC_AUTH_B64:?ORTHANC_BASIC_AUTH_B64 is required (see scripts/orthanc-basic-auth.sh)}
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/templates:/etc/nginx/templates:ro
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
      ohif:
        condition: service_started
      orthanc:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/health/live >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [edge]
    logging: *default-logging

networks:
  # Reachable by the edge proxy.
  edge:
  # Data stores; never attached to nginx.
  internal:

volumes:
  postgres_data:
  redis_data:
  minio_data:
  orthanc_data:
